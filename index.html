<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escala del dolor - Barra + Rostros sexys</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --text: #222;
      --muted: #555;
      --primary: #1976d2;
    }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 24px; background: var(--bg); color: var(--text); }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 14px; color: var(--muted); }
    .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 20px; max-width: 980px; margin: 0 auto; }

    /* Bloque EVA original: etiquetas + gradiente + slider */
    .eva { max-width: 940px; margin: 0 auto 16px; }
    .eva-labels-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 1.05em; }
    .eva-label-left { color: #1ec800; font-weight: 600; }
    .eva-label-right { color: #d32f2f; font-weight: 600; }
    .eva-gradient-bar { width: 100%; height: 48px; border-radius: 28px; background: linear-gradient(90deg, #1ec800 0%, #fff700 50%, #ff0000 100%); position: relative; margin-bottom: -38px; z-index: 2; box-shadow: 0 2px 10px #0001; border: 2px solid #aaa; }
    .eva-slider { width: 100%; margin-top: 0; margin-bottom: 10px; z-index: 3; position: relative; background: transparent; -webkit-appearance: none; appearance: none; height: 48px; outline: none; }
    .eva-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 32px; height: 60px; background: #444; border-radius: 20px; box-shadow: 0 0 8px #4446; cursor: pointer; margin-top: -6px; border: 4px solid #fff; transition: background 0.2s; }
    .eva-slider:focus::-webkit-slider-thumb { background: var(--primary); }
    .eva-slider::-moz-range-thumb { width: 32px; height: 60px; background: #444; border-radius: 20px; box-shadow: 0 0 8px #4446; cursor: pointer; border: 4px solid #fff; transition: background 0.2s; }
    .eva-slider:focus::-moz-range-thumb { background: var(--primary); }
    .eva-slider::-webkit-slider-runnable-track { background: transparent; height: 48px; }
    .eva-slider::-moz-range-track { background: transparent; height: 48px; }

    .eva-valor { text-align: right; font-size: 14px; color: var(--muted); margin: 0 4px 10px; }

    /* Imagen de rostros + marcador sincronizado con el slider */
    .rostros-wrap { position: relative; width: 100%; max-width: 940px; margin: 0 auto 8px; }
    .rostros { width: 100%; display: block; border-radius: 8px; }
    .face-marker { position: absolute; top: 6px; left: 0; transform: translateX(-50%); width: 18px; height: 18px; border-radius: 50%; background: var(--primary); border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .scale-numbers { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; align-items: start; font-size: 13px; color: var(--muted); }
    .scale-numbers div { text-align: center; }

    @media (max-width: 640px) {
      .eva-labels-bar { font-size: 1em; }
      .face-marker { width: 16px; height: 16px; }
      .scale-numbers { gap: 4px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Escala del dolor: barra análoga + rostros</h1>
    <p>La barra análoga con gradiente permanece y se sincroniza con la simbología de rostros del archivo PNG.</p>

    <!-- Bloque EVA (barra de color + slider) -->
    <div class="eva" aria-label="Escala visual análoga del dolor">
      <div class="eva-labels-bar">
        <span class="eva-label-left">Dolor ausente</span>
        <span class="eva-label-right">Dolor insoportable</span>
      </div>
      <div class="eva-gradient-bar"></div>
      <input type="range" min="0" max="10" value="0" step="0.1" class="eva-slider" id="evaSlider" aria-label="Selecciona nivel de dolor de 0 a 10" />
      <div class="eva-valor">Nivel seleccionado: <strong id="valorDolor">0.0</strong></div>
    </div>

    <!-- Imagen de rostros con marcador sincronizado -->
    <div class="rostros-wrap" id="rostrosWrap">
      <img src="dolor_2.png" alt="Simbología de rostros de la escala del dolor" class="rostros" />
      <div class="face-marker" id="faceMarker" aria-hidden="true"></div>
    </div>
    <div class="scale-numbers" aria-hidden="true">
      <div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('evaSlider');
    const marker = document.getElementById('faceMarker');
    const rostrosWrap = document.getElementById('rostrosWrap');
    const valorDolor = document.getElementById('valorDolor');

    function updateUI() {
      const val = parseFloat(slider.value);
      valorDolor.textContent = val.toFixed(1);

      const wrapRect = rostrosWrap.getBoundingClientRect();
      const markerWidth = marker.offsetWidth || 18;
      const maxLeft = wrapRect.width - markerWidth; // límites dentro de la imagen
      const leftPx = (val / 10) * maxLeft;
      marker.style.left = leftPx + 'px';
    }

    slider.addEventListener('input', updateUI);
    window.addEventListener('resize', updateUI);
    window.addEventListener('load', updateUI);
  </script>
</body>
</html>
